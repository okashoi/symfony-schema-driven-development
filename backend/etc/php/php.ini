zend.exception_ignore_args = off
memory_limit = 1G
error_reporting = E_ALL
display_errors = on
display_startup_errors = on
log_errors = on
error_log = php://stderr
default_charset = UTF-8

[Date]
date.timezone = Asia/Tokyo

[Assertion]
zend.assertions = 1

[mbstring]
mbstring.language = Japanese

[JIT]
opcache.jit=on
opcache.jit_buffer_size = 128M
